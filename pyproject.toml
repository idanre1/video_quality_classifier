[project]
name = "video-quality-classifier"
version = "0.1.0"
description = "Group a video library by real quality (bits per pixel, codec, effective resolution)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
vqc = "vqc:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["vqc.py"]
